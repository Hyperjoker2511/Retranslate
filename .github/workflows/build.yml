name: Build ReTranslate

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  gate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore binary assets (stored base64-encoded for transport)
        run: |
          find . -name '*.b64' -print0 | while IFS= read -r -d '' f; do
            base64 -d "$f" > "${f%.b64}"
            rm "$f"
          done

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Test gate (full unit suite, one clean run)
        run: bash gradlew clean :app:testDebugUnitTest

      - name: Create throwaway CI signing key
        run: |
          mkdir -p release
          keytool -genkeypair -keystore release/retranslate-release.jks \
            -alias retranslate -storepass rtci-dummy -keypass rtci-dummy \
            -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=CI"

      - name: Build release (CI key; re-signed with the real key later)
        env:
          RT_STORE_PASSWORD: rtci-dummy
          RT_KEY_ALIAS: retranslate
          RT_KEY_PASSWORD: rtci-dummy
        run: bash gradlew :app:assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: ReTranslate-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/reports/tests/
